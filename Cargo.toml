[package]
name = "atmega32u4-rust-template"
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
lto = true

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
lto = false

[dependencies]
avr-device = { version = "0.9.0", features = ["atmega32u4"] }
